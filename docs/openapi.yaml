paths:
  /me:
    get:
      operationId: get_me
      tags:
      - Session
      summary: Current user, role and memberships
      x-roles:
      - any signed-in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orgs/{org}/tournaments:
    get:
      operationId: get_orgs__org__tournaments
      tags:
      - Tournaments
      summary: 'List tournaments (query: status, include=archived)'
      x-roles:
      - any signed-in
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentSummary'
        '401':
          description: unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: post_orgs__org__tournaments
      tags:
      - Tournaments
      summary: Create a draft tournament
